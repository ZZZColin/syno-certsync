name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.1.0)"
        required: true
        default: "latest"
      also_latest:
        description: "Also push the 'latest' tag"
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE_NAME: syno-certsync

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ inputs.tag }}
          ALSO_LATEST: ${{ inputs.also_latest }}
        run: |
          # inputs go through env vars (not inline ${{ }}) to avoid shell injection
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid tag: $TAG"; exit 1
          fi
          user=$(echo "$DH_USER" | tr '[:upper:]' '[:lower:]')
          tags="docker.io/${user}/${IMAGE_NAME}:${TAG}"
          if [ "$ALSO_LATEST" = "true" ] && [ "$TAG" != "latest" ]; then
            tags="${tags},docker.io/${user}/${IMAGE_NAME}:latest"
          fi
          echo "list=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
